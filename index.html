<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allez Migui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mx: 50%;
      --my: 50%;
      --px: 0;
      --py: 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      overflow: hidden;
      cursor: none;
      background: #7eb6d9;
      color: #132018;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (hover: none) {
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
    }

    .theme {
      position: fixed;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    .theme.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* ——— ROAD / ALPS SUMMER ——— */
    .theme-road .scene {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          780px circle at var(--mx) var(--my),
          rgba(255, 244, 210, 0.55) 0%,
          transparent 42%
        ),
        linear-gradient(
          180deg,
          #6eb0d6 0%,
          #8ec4e0 28%,
          #a8d4a4 58%,
          #6f9e5c 78%,
          #4f7a45 100%
        );
    }

    .theme-road .sun {
      position: absolute;
      width: min(26vw, 240px);
      height: min(26vw, 240px);
      top: 7%;
      right: 14%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #fff8e4 0%, #ffd56a 38%, rgba(255, 190, 70, 0.2) 62%, transparent 72%);
      transform: translate3d(calc(var(--px) * -22px), calc(var(--py) * 12px), 0);
      filter: blur(1px);
      pointer-events: none;
      will-change: transform;
    }

    .theme-road .mountains {
      position: absolute;
      inset: 0;
      pointer-events: none;
      will-change: transform;
    }

    .theme-road .mountains svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .theme-road .mountains--far {
      transform: translate3d(calc(var(--px) * -16px), calc(var(--py) * -8px), 0);
      opacity: 0.9;
    }

    .theme-road .mountains--near {
      transform: translate3d(calc(var(--px) * -34px), calc(var(--py) * -14px), 0);
    }

    .peak-far { fill: #5a8fb8; }
    .peak-mid { fill: #4a7a52; }
    .peak-near { fill: #3d6a40; }
    .snow { fill: rgba(255, 255, 255, 0.72); }

    .theme-road .roads {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      pointer-events: none;
      will-change: transform;
      transform: translate3d(calc(var(--px) * -42px), calc(var(--py) * -22px), 0);
    }

    .theme-road .roads svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .road-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .road-path--base {
      stroke: #3a3f46;
      stroke-width: 42;
    }

    .road-path--shoulder {
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 46;
    }

    .road-path--lane {
      stroke: #f0d045;
      stroke-width: 3;
      stroke-dasharray: 26 16;
      animation: dash-flow 1.4s linear infinite;
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -84; }
    }

    .theme-road .wheel {
      position: absolute;
      width: min(38vw, 340px);
      height: min(38vw, 340px);
      right: 5%;
      bottom: 8%;
      border-radius: 50%;
      border: 2px solid rgba(20, 28, 22, 0.35);
      box-shadow:
        inset 0 0 0 14px rgba(20, 28, 22, 0.08),
        0 18px 50px rgba(20, 40, 24, 0.18);
      transform: translate3d(calc(var(--px) * 28px), calc(var(--py) * 18px), 0)
                 rotate(calc(var(--px) * 20deg + var(--py) * 8deg));
      will-change: transform;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.12), transparent 55%);
    }

    .theme-road .wheel::before,
    .theme-road .wheel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(20, 28, 22, 0.28);
    }

    .theme-road .wheel::before { inset: 14%; border-color: rgba(240, 208, 69, 0.55); }
    .theme-road .wheel::after {
      inset: 32%;
      border-color: rgba(196, 48, 28, 0.5);
      background: radial-gradient(circle, rgba(196, 48, 28, 0.15), transparent 70%);
    }

    .theme-road .spoke {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 50%;
      margin-left: -1px;
      background: linear-gradient(to top, transparent, rgba(20, 28, 22, 0.45));
      transform-origin: top center;
    }

    .theme-road .haze {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 55%, rgba(255, 255, 255, 0.12) 100%);
    }

    .theme-road .content {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 5rem);
      max-width: 1100px;
      transform: translate3d(calc(var(--px) * 12px), calc(var(--py) * 7px), 0);
      will-change: transform;
    }

    .theme-road .eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #1f3d28;
      margin-bottom: 1.2rem;
      border-left: 3px solid #c4301c;
      padding-left: 0.75rem;
    }

    .theme-road h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(4.5rem, 17vw, 10rem);
      line-height: 0.86;
      letter-spacing: 0.03em;
      font-weight: 400;
      color: #102018;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.25);
      margin-bottom: 1.1rem;
    }

    .theme-road h1 em {
      font-style: normal;
      color: #c4301c;
    }

    .theme-road .subtitle {
      max-width: 28rem;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      font-weight: 500;
      line-height: 1.5;
      color: rgba(16, 32, 24, 0.72);
      letter-spacing: 0.01em;
    }

    .theme-road .hint {
      margin-top: 2.5rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(16, 32, 24, 0.4);
    }

    /* ——— PILATES / ACTIVE VACATION ——— */
    .theme-studio .scene {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          720px circle at var(--mx) var(--my),
          rgba(255, 220, 140, 0.5) 0%,
          transparent 40%
        ),
        radial-gradient(
          900px circle at calc(100% - var(--mx)) calc(100% - var(--my)),
          rgba(20, 140, 150, 0.28) 0%,
          transparent 48%
        ),
        linear-gradient(
          180deg,
          #5eb8d4 0%,
          #7ec8c0 32%,
          #3aa89a 58%,
          #1f7a78 82%,
          #155e68 100%
        );
    }

    .theme-studio .bloom {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      will-change: transform;
    }

    .theme-studio .bloom--1 {
      width: min(55vw, 520px);
      height: min(55vw, 520px);
      background: rgba(255, 140, 90, 0.35);
      top: -10%;
      left: -8%;
      transform: translate3d(calc(var(--px) * 40px), calc(var(--py) * 28px), 0);
    }

    .theme-studio .bloom--2 {
      width: min(48vw, 440px);
      height: min(48vw, 440px);
      background: rgba(50, 200, 170, 0.35);
      right: -6%;
      bottom: 8%;
      transform: translate3d(calc(var(--px) * -36px), calc(var(--py) * -24px), 0);
    }

    .theme-studio .bloom--3 {
      width: min(36vw, 320px);
      height: min(36vw, 320px);
      background: rgba(255, 230, 150, 0.3);
      left: 42%;
      top: 48%;
      transform: translate3d(calc(var(--px) * 22px), calc(var(--py) * -30px), 0);
    }

    .theme-studio .horizon {
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: 0;
      height: 42%;
      background: linear-gradient(180deg, transparent 0%, rgba(12, 70, 78, 0.35) 35%, rgba(10, 55, 62, 0.55) 100%);
      transform: translate3d(calc(var(--px) * -10px), calc(var(--py) * 6px), 0);
      pointer-events: none;
    }

    .theme-studio .arcs {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      opacity: 0.7;
      transform: translate3d(calc(var(--px) * -28px), calc(var(--py) * -16px), 0);
      pointer-events: none;
      will-change: transform;
    }

    .theme-studio .arcs svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .arc-line {
      fill: none;
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 10 14;
      animation: arc-flow 2.4s linear infinite;
    }

    .arc-line--bold {
      stroke: rgba(255, 120, 70, 0.55);
      stroke-width: 3;
      stroke-dasharray: 18 12;
      animation-duration: 1.6s;
    }

    .arc-line--soft {
      stroke: rgba(255, 255, 255, 0.18);
      stroke-width: 1.5;
      stroke-dasharray: 6 16;
      animation-direction: reverse;
      animation-duration: 3.2s;
    }

    @keyframes arc-flow {
      to { stroke-dashoffset: -64; }
    }

    .theme-studio .sun {
      position: absolute;
      width: min(32vw, 300px);
      height: min(32vw, 300px);
      top: 8%;
      right: 10%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8e8 0%, #ffc857 32%, rgba(255, 150, 70, 0.25) 58%, transparent 72%);
      transform: translate3d(calc(var(--px) * -20px), calc(var(--py) * 14px), 0) scale(calc(1 + var(--px) * 0.04));
      filter: blur(1px);
      pointer-events: none;
      will-change: transform;
    }

    .theme-studio .content {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(1.5rem, 6vw, 5rem);
      transform: translate3d(calc(var(--px) * 8px), calc(var(--py) * 5px), 0);
      will-change: transform;
    }

    .theme-studio .eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #fff4e0;
      margin-bottom: 1.3rem;
      text-shadow: 0 2px 16px rgba(0, 40, 50, 0.25);
    }

    .theme-studio h1 {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: clamp(4.4rem, 15vw, 8.8rem);
      font-weight: 700;
      font-style: normal;
      line-height: 0.9;
      letter-spacing: -0.03em;
      color: #fffaf2;
      margin-bottom: 1.2rem;
      text-shadow: 0 8px 36px rgba(0, 40, 50, 0.28);
    }

    .theme-studio h1 em {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 600;
      color: #ffd27a;
    }

    .theme-studio .subtitle {
      max-width: 26rem;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      font-weight: 500;
      line-height: 1.55;
      color: rgba(255, 250, 242, 0.88);
    }

    .theme-studio .subtitle em {
      font-style: italic;
      color: #ffb08a;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.12em;
    }

    .theme-studio .hint {
      margin-top: 2.6rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 250, 242, 0.45);
    }

    /* ——— CURSOR ——— */
    .cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      background: #c4301c;
      box-shadow: 0 0 16px rgba(196, 48, 28, 0.55);
      pointer-events: none;
      z-index: 30;
      transform: translate3d(-100px, -100px, 0);
      will-change: transform, background, box-shadow;
      transition: background 0.35s ease, box-shadow 0.35s ease, width 0.25s ease, height 0.25s ease, margin 0.25s ease;
    }

    .cursor-ring {
      position: fixed;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border-radius: 50%;
      border: 1.5px solid rgba(16, 32, 24, 0.35);
      pointer-events: none;
      z-index: 29;
      transform: translate3d(-100px, -100px, 0);
      will-change: transform, border-color, width, height, margin;
      transition: border-color 0.35s ease, width 0.25s ease, height 0.25s ease, margin 0.25s ease;
    }

    body.is-studio .cursor {
      background: #ff7a45;
      box-shadow: 0 0 18px rgba(255, 122, 69, 0.55);
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
    }

    body.is-studio .cursor-ring {
      border-color: rgba(255, 250, 242, 0.55);
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
    }
  </style>
</head>
<body>
  <!-- ROAD -->
  <section class="theme theme-road is-active" data-theme="road" aria-label="Allez Migui">
    <div class="scene" aria-hidden="true">
      <div class="sun"></div>

      <div class="mountains mountains--far">
        <svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
          <path class="peak-far" d="M0,520 L180,280 L260,360 L420,180 L560,340 L720,220 L880,380 L1040,200 L1180,320 L1400,250 L1400,900 L0,900 Z" />
          <path class="snow" d="M420,180 L460,240 L400,230 Z" />
          <path class="snow" d="M720,220 L755,275 L690,265 Z" />
          <path class="snow" d="M1040,200 L1075,255 L1010,245 Z" />
        </svg>
      </div>

      <div class="mountains mountains--near">
        <svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
          <path class="peak-mid" d="M0,620 L220,420 L340,520 L520,360 L700,510 L900,390 L1100,530 L1280,430 L1400,500 L1400,900 L0,900 Z" />
          <path class="peak-near" d="M0,760 L160,620 L300,700 L480,560 L640,680 L820,580 L1000,700 L1200,610 L1400,690 L1400,900 L0,900 Z" />
        </svg>
      </div>

      <div class="roads">
        <svg viewBox="0 0 1400 900" preserveAspectRatio="none">
          <path class="road-path road-path--shoulder" d="M-80,860 C180,780 320,700 460,620 S740,470 900,420 S1180,360 1520,300" />
          <path class="road-path road-path--base" d="M-80,860 C180,780 320,700 460,620 S740,470 900,420 S1180,360 1520,300" />
          <path class="road-path road-path--lane" d="M-80,860 C180,780 320,700 460,620 S740,470 900,420 S1180,360 1520,300" />
        </svg>
      </div>

      <div class="wheel">
        <span class="spoke" style="transform: rotate(0deg)"></span>
        <span class="spoke" style="transform: rotate(30deg)"></span>
        <span class="spoke" style="transform: rotate(60deg)"></span>
        <span class="spoke" style="transform: rotate(90deg)"></span>
        <span class="spoke" style="transform: rotate(120deg)"></span>
        <span class="spoke" style="transform: rotate(150deg)"></span>
      </div>

      <div class="haze"></div>
    </div>
    <div class="content">
      <p class="eyebrow">Alps · Summer · Climb</p>
      <h1>Allez <em>Migui</em></h1>
      <p class="subtitle">High passes, open sky, fresh legs. The road goes up — so do you.</p>
      <p class="hint">Click to switch</p>
    </div>
  </section>

  <!-- STUDIO -->
  <section class="theme theme-studio" data-theme="studio" aria-label="Go Lau" hidden>
    <div class="scene" aria-hidden="true">
      <div class="bloom bloom--1"></div>
      <div class="bloom bloom--2"></div>
      <div class="bloom bloom--3"></div>
      <div class="sun"></div>
      <div class="horizon"></div>
      <div class="arcs">
        <svg viewBox="0 0 1400 900" preserveAspectRatio="none">
          <path class="arc-line arc-line--soft" d="M-40,260 C220,180 420,320 680,250 S1100,140 1480,220" />
          <path class="arc-line arc-line--bold" d="M-60,480 C240,390 480,560 760,470 S1180,340 1520,430" />
          <path class="arc-line" d="M-40,680 C260,600 520,760 820,670 S1220,540 1540,630" />
        </svg>
      </div>
    </div>
    <div class="content">
      <p class="eyebrow">Costa Rica · Train · Escape</p>
      <h1>Go <em>Lau</em></h1>
      <p class="subtitle">Sunrise sessions. Ocean air. Strong body, freer mind — your <em>active paradise</em>.</p>
      <p class="hint">Click to switch</p>
    </div>
  </section>

  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <script>
    (() => {
      const root = document.documentElement;
      const body = document.body;
      const road = document.querySelector(".theme-road");
      const studio = document.querySelector(".theme-studio");
      const cursor = document.querySelector(".cursor");
      const ring = document.querySelector(".cursor-ring");

      let targetX = 0.5;
      let targetY = 0.5;
      let currentX = 0.5;
      let currentY = 0.5;
      let mousePx = -100;
      let mousePy = -100;
      let ringX = -100;
      let ringY = -100;
      let studioMode = false;

      const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function setStudio(on) {
        studioMode = on;
        body.classList.toggle("is-studio", on);
        road.classList.toggle("is-active", !on);
        studio.classList.toggle("is-active", on);
        studio.hidden = !on;
        road.hidden = on;
        document.title = on ? "Go Lau" : "Allez Migui";
      }

      window.addEventListener("pointermove", (e) => {
        targetX = e.clientX / window.innerWidth;
        targetY = e.clientY / window.innerHeight;
        mousePx = e.clientX;
        mousePy = e.clientY;
      }, { passive: true });

      window.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        setStudio(!studioMode);
      });

      function frame() {
        const ease = prefersReduced ? 1 : 0.075;
        currentX += (targetX - currentX) * ease;
        currentY += (targetY - currentY) * ease;
        ringX += (mousePx - ringX) * (prefersReduced ? 1 : 0.12);
        ringY += (mousePy - ringY) * (prefersReduced ? 1 : 0.12);

        const px = (currentX - 0.5) * 2;
        const py = (currentY - 0.5) * 2;

        root.style.setProperty("--mx", `${(currentX * 100).toFixed(2)}%`);
        root.style.setProperty("--my", `${(currentY * 100).toFixed(2)}%`);
        root.style.setProperty("--px", px.toFixed(3));
        root.style.setProperty("--py", py.toFixed(3));

        cursor.style.transform = `translate3d(${mousePx}px, ${mousePy}px, 0)`;
        ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
