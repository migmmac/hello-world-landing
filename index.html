<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allez Migui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mx: 50%;
      --my: 50%;
      --px: 0;
      --py: 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      overflow: hidden;
      cursor: none;
      background: #07090c;
      color: #e8eaee;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (hover: none) {
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
    }

    .theme {
      position: fixed;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    .theme.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* ——— ROAD / MANLY ——— */
    .theme-road .scene {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          720px circle at var(--mx) var(--my),
          rgba(196, 48, 28, 0.22) 0%,
          transparent 40%
        ),
        radial-gradient(
          900px circle at calc(100% - var(--mx)) calc(100% - var(--my)),
          rgba(120, 130, 140, 0.12) 0%,
          transparent 48%
        ),
        linear-gradient(155deg, #05070a 0%, #10141a 42%, #080b0f 100%);
    }

    .theme-road .roads {
      position: absolute;
      inset: -14%;
      width: 128%;
      height: 128%;
      pointer-events: none;
      will-change: transform;
    }

    .theme-road .roads--far {
      opacity: 0.45;
      transform: translate3d(calc(var(--px) * -14px), calc(var(--py) * -10px), 0) scale(1.04);
    }

    .theme-road .roads--near {
      transform: translate3d(calc(var(--px) * -48px), calc(var(--py) * -30px), 0);
    }

    .theme-road .roads svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .road-path {
      fill: none;
      stroke-linecap: butt;
      stroke-linejoin: miter;
    }

    .road-path--base {
      stroke: rgba(255, 255, 255, 0.045);
      stroke-width: 56;
    }

    .road-path--lane {
      stroke: #e8c41a;
      stroke-width: 3;
      stroke-dasharray: 28 18;
      animation: dash-flow 1.35s linear infinite;
    }

    .road-path--edge {
      stroke: rgba(232, 234, 238, 0.18);
      stroke-width: 1;
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -92; }
    }

    .theme-road .wheel {
      position: absolute;
      width: min(48vw, 460px);
      height: min(48vw, 460px);
      right: 3%;
      bottom: 4%;
      border-radius: 50%;
      border: 2px solid rgba(232, 234, 238, 0.16);
      box-shadow:
        inset 0 0 0 18px rgba(0, 0, 0, 0.35),
        0 0 80px rgba(196, 48, 28, 0.12);
      transform: translate3d(calc(var(--px) * 34px), calc(var(--py) * 22px), 0)
                 rotate(calc(var(--px) * 24deg + var(--py) * 10deg));
      will-change: transform;
      pointer-events: none;
    }

    .theme-road .wheel::before,
    .theme-road .wheel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(232, 196, 26, 0.35);
    }

    .theme-road .wheel::before { inset: 14%; }
    .theme-road .wheel::after {
      inset: 32%;
      border-color: rgba(196, 48, 28, 0.55);
      background: radial-gradient(circle, rgba(196, 48, 28, 0.2), transparent 70%);
    }

    .theme-road .spoke {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 50%;
      margin-left: -1px;
      background: linear-gradient(to top, transparent, rgba(232, 234, 238, 0.4));
      transform-origin: top center;
    }

    .theme-road .grain {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .theme-road .content {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 5rem);
      max-width: 1100px;
      transform: translate3d(calc(var(--px) * 12px), calc(var(--py) * 7px), 0);
      will-change: transform;
    }

    .theme-road .eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #e8c41a;
      margin-bottom: 1.2rem;
      border-left: 3px solid #c4301c;
      padding-left: 0.75rem;
    }

    .theme-road h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(4.5rem, 17vw, 10rem);
      line-height: 0.86;
      letter-spacing: 0.03em;
      font-weight: 400;
      color: #f3f4f6;
      text-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
      margin-bottom: 1.1rem;
    }

    .theme-road h1 em {
      font-style: normal;
      color: #c4301c;
    }

    .theme-road .subtitle {
      max-width: 26rem;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      font-weight: 500;
      line-height: 1.5;
      color: rgba(232, 234, 238, 0.62);
      letter-spacing: 0.01em;
    }

    .theme-road .hint {
      margin-top: 2.5rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(232, 234, 238, 0.35);
    }

    /* ——— PILATES / COSTA RICA ——— */
    .theme-studio .scene {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          680px circle at var(--mx) var(--my),
          rgba(255, 236, 200, 0.45) 0%,
          transparent 42%
        ),
        radial-gradient(
          820px circle at calc(100% - var(--mx)) calc(100% - var(--my)),
          rgba(46, 125, 110, 0.28) 0%,
          transparent 50%
        ),
        linear-gradient(165deg, #e8f2ee 0%, #d5ebe3 35%, #f3efe6 70%, #e7f0ea 100%);
    }

    .theme-studio .bloom {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      will-change: transform;
    }

    .theme-studio .bloom--1 {
      width: min(55vw, 520px);
      height: min(55vw, 520px);
      background: rgba(90, 168, 148, 0.45);
      top: -8%;
      left: -6%;
      transform: translate3d(calc(var(--px) * 40px), calc(var(--py) * 28px), 0);
    }

    .theme-studio .bloom--2 {
      width: min(48vw, 440px);
      height: min(48vw, 440px);
      background: rgba(255, 196, 140, 0.4);
      right: -4%;
      bottom: 5%;
      transform: translate3d(calc(var(--px) * -36px), calc(var(--py) * -24px), 0);
    }

    .theme-studio .bloom--3 {
      width: min(36vw, 320px);
      height: min(36vw, 320px);
      background: rgba(62, 140, 160, 0.28);
      left: 40%;
      top: 55%;
      transform: translate3d(calc(var(--px) * 22px), calc(var(--py) * -30px), 0);
    }

    .theme-studio .waves {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      opacity: 0.55;
      transform: translate3d(calc(var(--px) * -24px), calc(var(--py) * -16px), 0);
      pointer-events: none;
      will-change: transform;
    }

    .theme-studio .waves svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wave-line {
      fill: none;
      stroke: rgba(36, 96, 86, 0.22);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .wave-line--soft {
      stroke: rgba(180, 120, 70, 0.18);
      stroke-width: 1.25;
    }

    .theme-studio .sun {
      position: absolute;
      width: min(28vw, 260px);
      height: min(28vw, 260px);
      top: 12%;
      right: 12%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff6e0 0%, #ffd28a 35%, rgba(255, 180, 90, 0.15) 65%, transparent 72%);
      transform: translate3d(calc(var(--px) * -20px), calc(var(--py) * 14px), 0) scale(calc(1 + var(--px) * 0.04));
      filter: blur(2px);
      pointer-events: none;
      will-change: transform;
    }

    .theme-studio .content {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(1.5rem, 6vw, 5rem);
      transform: translate3d(calc(var(--px) * 8px), calc(var(--py) * 5px), 0);
      will-change: transform;
    }

    .theme-studio .eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #2f6f63;
      margin-bottom: 1.4rem;
    }

    .theme-studio h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(4.2rem, 14vw, 8.5rem);
      font-weight: 600;
      font-style: italic;
      line-height: 0.92;
      letter-spacing: -0.02em;
      color: #1a3d36;
      margin-bottom: 1.35rem;
      text-shadow: 0 10px 40px rgba(255, 255, 255, 0.35);
    }

    .theme-studio .subtitle {
      max-width: 22rem;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      font-weight: 400;
      line-height: 1.65;
      color: rgba(26, 61, 54, 0.72);
    }

    .theme-studio .subtitle em {
      font-style: italic;
      color: #b56a2b;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.15em;
    }

    .theme-studio .hint {
      margin-top: 2.6rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(26, 61, 54, 0.4);
    }

    /* ——— CURSOR ——— */
    .cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      background: #e8c41a;
      box-shadow: 0 0 16px rgba(232, 196, 26, 0.65);
      pointer-events: none;
      z-index: 30;
      transform: translate3d(-100px, -100px, 0);
      will-change: transform, background, box-shadow;
      transition: background 0.35s ease, box-shadow 0.35s ease, width 0.25s ease, height 0.25s ease, margin 0.25s ease;
    }

    .cursor-ring {
      position: fixed;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border-radius: 50%;
      border: 1.5px solid rgba(232, 234, 238, 0.35);
      pointer-events: none;
      z-index: 29;
      transform: translate3d(-100px, -100px, 0);
      will-change: transform, border-color, width, height, margin;
      transition: border-color 0.35s ease, width 0.25s ease, height 0.25s ease, margin 0.25s ease;
    }

    body.is-studio .cursor {
      background: #2f6f63;
      box-shadow: 0 0 18px rgba(47, 111, 99, 0.45);
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
    }

    body.is-studio .cursor-ring {
      border-color: rgba(47, 111, 99, 0.45);
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
    }
  </style>
</head>
<body>
  <!-- ROAD -->
  <section class="theme theme-road is-active" data-theme="road" aria-label="Allez Migui">
    <div class="scene" aria-hidden="true">
      <div class="roads roads--far">
        <svg viewBox="0 0 1400 900" preserveAspectRatio="none">
          <path class="road-path road-path--edge" d="M-80,700 C240,620 420,480 620,390 S1040,250 1520,140" />
          <path class="road-path road-path--edge" d="M-40,160 C280,250 500,360 720,520 S1140,780 1520,860" />
        </svg>
      </div>
      <div class="roads roads--near">
        <svg viewBox="0 0 1400 900" preserveAspectRatio="none">
          <path class="road-path road-path--base" d="M-120,800 C160,710 340,540 540,430 S940,270 1180,210 S1500,150 1560,120" />
          <path class="road-path road-path--lane" d="M-120,800 C160,710 340,540 540,430 S940,270 1180,210 S1500,150 1560,120" />
          <path class="road-path road-path--base" d="M-80,90 C260,200 480,330 720,500 S1140,800 1540,900" />
          <path class="road-path road-path--lane" d="M-80,90 C260,200 480,330 720,500 S1140,800 1540,900" />
        </svg>
      </div>
      <div class="wheel">
        <span class="spoke" style="transform: rotate(0deg)"></span>
        <span class="spoke" style="transform: rotate(30deg)"></span>
        <span class="spoke" style="transform: rotate(60deg)"></span>
        <span class="spoke" style="transform: rotate(90deg)"></span>
        <span class="spoke" style="transform: rotate(120deg)"></span>
        <span class="spoke" style="transform: rotate(150deg)"></span>
      </div>
      <div class="grain"></div>
    </div>
    <div class="content">
      <p class="eyebrow">Full gas · No mercy</p>
      <h1>Allez <em>Migui</em></h1>
      <p class="subtitle">Hard road. Clean line. Hold the pressure — then go.</p>
      <p class="hint">Hold click to switch</p>
    </div>
  </section>

  <!-- STUDIO -->
  <section class="theme theme-studio" data-theme="studio" aria-label="Go Lau" hidden>
    <div class="scene" aria-hidden="true">
      <div class="bloom bloom--1"></div>
      <div class="bloom bloom--2"></div>
      <div class="bloom bloom--3"></div>
      <div class="sun"></div>
      <div class="waves">
        <svg viewBox="0 0 1400 900" preserveAspectRatio="none">
          <path class="wave-line" d="M-40,220 C180,180 320,260 520,240 S860,160 1100,210 S1380,280 1480,250" />
          <path class="wave-line wave-line--soft" d="M-60,380 C200,340 380,420 600,390 S980,310 1220,360 S1460,430 1520,400" />
          <path class="wave-line" d="M-40,560 C220,520 400,600 640,570 S1020,490 1260,540 S1480,610 1540,580" />
          <path class="wave-line wave-line--soft" d="M-80,720 C180,680 360,760 580,730 S980,650 1220,700 S1460,770 1520,740" />
        </svg>
      </div>
    </div>
    <div class="content">
      <p class="eyebrow">Costa Rica · Breath · Strength</p>
      <h1>Go Lau</h1>
      <p class="subtitle">Find your center. Move with intention.<br>Become <em>light</em>.</p>
      <p class="hint">Release to return</p>
    </div>
  </section>

  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <script>
    (() => {
      const root = document.documentElement;
      const body = document.body;
      const road = document.querySelector(".theme-road");
      const studio = document.querySelector(".theme-studio");
      const cursor = document.querySelector(".cursor");
      const ring = document.querySelector(".cursor-ring");

      let targetX = 0.5;
      let targetY = 0.5;
      let currentX = 0.5;
      let currentY = 0.5;
      let mousePx = -100;
      let mousePy = -100;
      let ringX = -100;
      let ringY = -100;
      let studioMode = false;

      const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function setStudio(on) {
        studioMode = on;
        body.classList.toggle("is-studio", on);
        road.classList.toggle("is-active", !on);
        studio.classList.toggle("is-active", on);
        studio.hidden = !on;
        road.hidden = on;
        document.title = on ? "Go Lau" : "Allez Migui";
      }

      window.addEventListener("pointermove", (e) => {
        targetX = e.clientX / window.innerWidth;
        targetY = e.clientY / window.innerHeight;
        mousePx = e.clientX;
        mousePy = e.clientY;
      }, { passive: true });

      window.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        setStudio(true);
      });

      window.addEventListener("pointerup", () => setStudio(false));
      window.addEventListener("pointercancel", () => setStudio(false));
      window.addEventListener("blur", () => setStudio(false));

      function frame() {
        const ease = prefersReduced ? 1 : 0.075;
        currentX += (targetX - currentX) * ease;
        currentY += (targetY - currentY) * ease;
        ringX += (mousePx - ringX) * (prefersReduced ? 1 : 0.12);
        ringY += (mousePy - ringY) * (prefersReduced ? 1 : 0.12);

        const px = (currentX - 0.5) * 2;
        const py = (currentY - 0.5) * 2;

        root.style.setProperty("--mx", `${(currentX * 100).toFixed(2)}%`);
        root.style.setProperty("--my", `${(currentY * 100).toFixed(2)}%`);
        root.style.setProperty("--px", px.toFixed(3));
        root.style.setProperty("--py", py.toFixed(3));

        cursor.style.transform = `translate3d(${mousePx}px, ${mousePy}px, 0)`;
        ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
