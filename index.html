<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Laura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a0e1a;
      --court: #1a3d2e;
      --electric: #00d4ff;
      --lilac: #b794f6;
      --lime: #c8f542;
      --hot: #ff3366;
      --white: #f4f6fb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Syne", system-ui, sans-serif;
      color: var(--white);
      background: var(--ink);
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(183, 148, 246, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, rgba(0, 212, 255, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(200, 245, 66, 0.12) 0%, transparent 45%),
        linear-gradient(165deg, #0a0e1a 0%, #121a2e 40%, #0f1628 100%);
    }

    .court-lines {
      position: fixed;
      inset: -20%;
      z-index: 0;
      opacity: 0.14;
      background-image:
        linear-gradient(90deg, transparent 49.5%, var(--electric) 49.5%, var(--electric) 50.5%, transparent 50.5%),
        linear-gradient(0deg, transparent 49.5%, var(--electric) 49.5%, var(--electric) 50.5%, transparent 50.5%);
      background-size: 120px 120px;
      transform: rotate(-8deg) scale(1.2);
      pointer-events: none;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.04;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 3rem;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      background: linear-gradient(90deg, var(--lime), var(--electric));
      padding: 0.55rem 1rem;
      border-radius: 999px;
      margin-bottom: 2rem;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.35);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 30px rgba(0, 212, 255, 0.25); }
      50% { box-shadow: 0 0 50px rgba(183, 148, 246, 0.45); }
    }

    h1 {
      font-size: clamp(3rem, 12vw, 6.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin-bottom: 1.25rem;
      background: linear-gradient(
        120deg,
        var(--white) 0%,
        var(--electric) 35%,
        var(--lilac) 70%,
        var(--white) 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 8s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .subtitle {
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(0.75rem, 2.5vw, 0.95rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(244, 246, 251, 0.65);
      max-width: 28ch;
      line-height: 1.6;
    }

    .subtitle em {
      font-style: normal;
      color: var(--lilac);
    }

    .accent-bar {
      margin-top: 3rem;
      display: flex;
      gap: 0.35rem;
      align-items: flex-end;
      height: 48px;
    }

    .accent-bar span {
      width: 4px;
      border-radius: 2px;
      background: var(--electric);
      animation: bounce 1.2s ease-in-out infinite;
    }

    .accent-bar span:nth-child(1) { height: 40%; animation-delay: 0s; background: var(--lilac); }
    .accent-bar span:nth-child(2) { height: 70%; animation-delay: 0.1s; }
    .accent-bar span:nth-child(3) { height: 100%; animation-delay: 0.2s; background: var(--lime); }
    .accent-bar span:nth-child(4) { height: 55%; animation-delay: 0.15s; background: var(--hot); }
    .accent-bar span:nth-child(5) { height: 85%; animation-delay: 0.05s; }

    @keyframes bounce {
      0%, 100% { transform: scaleY(1); opacity: 0.85; }
      50% { transform: scaleY(0.65); opacity: 1; }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .orb--1 {
      width: 320px;
      height: 320px;
      background: var(--lilac);
      top: -80px;
      right: -60px;
      opacity: 0.35;
    }

    .orb--2 {
      width: 280px;
      height: 280px;
      background: var(--electric);
      bottom: -100px;
      left: -80px;
      opacity: 0.28;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="court-lines" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="orb orb--1" aria-hidden="true"></div>
  <div class="orb orb--2" aria-hidden="true"></div>

  <main>
    <p class="badge">Masters 1000 · Canada</p>
    <h1>Hello Laura</h1>
    <p class="subtitle">Welcome to the <em>playground</em> — summer energy, centre-court bold.</p>
    <div class="accent-bar" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </main>
</body>
</html>
